    function matchingItems(){ const matching = active === '精選' ? allItems.filter(item => item.featured !== false) : allItems.filter(item => item.category === active); return [...matching].sort((a,b)=>(priorities[a.importance] ?? 9)-(priorities[b.importance] ?? 9)); }
    function renderFeed(){ const rows=matchingItems(); const feed=document.getElementById('feed'); if(!rows.length){feed.innerHTML='<div class="empty">今天沒有符合這個分類的高訊號資料。</div>';return;} feed.innerHTML=rows.map(item=>{const url=safeUrl(item.articleUrl);const title=item.titleZh || item.title || '未命名資料';const brief=item.briefZh || fallbackBrief(item);return `<article class="item" data-kind="${escapeHtml(item.category || '')}">${image(item)}<div class="item-main"><div class="item-meta"><span class="kind">${escapeHtml(displayName[item.category] || item.category || '情報')}</span><span>${escapeHtml(item.sourceName || '')}</span><span>·</span><span>${escapeHtml(dateText(item.publishedAt))}</span></div>${url?`<a class="title" href="${escapeHtml(url)}" target="_blank" rel="noreferrer">${escapeHtml(title)}</a>`:`<div class="title">${escapeHtml(title)}</div>`}<p class="brief">${escapeHtml(brief)}</p></div>${url?`<a class="source-link" href="${escapeHtml(url)}" target="_blank" rel="noreferrer">原文 ↗</a>`:''}</article>`;}).join(''); feed.querySelectorAll('img').forEach(node=>node.addEventListener('error',()=>node.remove(),{once:true})); }
