name: Daily e-mobility intelligence

on:
  workflow_dispatch:
  schedule:
    # 00:15 UTC is approximately 08:15 in Taipei (UTC+8).
    - cron: "15 0 * * *"

permissions:
  contents: write

concurrency:
  group: daily-e-mobility-intel
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the workspace
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Collect new intelligence
        shell: bash
        run: |
          if [ -f state/seen_items.json ]; then
            node scripts/daily_intel.mjs
          else
            node scripts/daily_intel.mjs --baseline
          fi

      - name: Save reports and deduplication state
        shell: bash
        run: |
          git add daily-output state "資訊工作台.html"
          if git diff --cached --quiet; then
            echo "No new report files to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: update daily e-mobility intelligence"
            git push
          fi
