<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>電動微型移動情報</title>
  <style>
    :root{--ink:#1d1d1f;--muted:#6e6e73;--line:#d2d2d7;--paper:#fff;--canvas:#f5f5f7;--blue:#0071e3;--blue-soft:#e8f2ff;--green:#1d7a4b;--green-soft:#eaf7ef;--orange:#b25000;--orange-soft:#fff0e6;--red:#b42318;--red-soft:#fff0ef;--violet:#6e56cf;--violet-soft:#f0edff}
    *{box-sizing:border-box}html{background:var(--canvas);scroll-behavior:smooth}body{margin:0;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;-webkit-font-smoothing:antialiased}
    .wrap{max-width:1120px;margin:0 auto;padding:52px 28px 72px}.top{display:flex;justify-content:space-between;gap:24px;align-items:flex-end}.eyebrow{margin:0 0 8px;color:var(--blue);font-size:12px;font-weight:700;letter-spacing:.09em}h1{margin:0;letter-spacing:-.055em;font-size:38px;line-height:1.08}.sub{margin:11px 0 0;color:var(--muted);font-size:14px}.stamp{white-space:nowrap;border:1px solid var(--line);border-radius:999px;background:#fff;padding:8px 12px;color:#424245;font-size:12px}
    .overview{display:grid;grid-template-columns:1.45fr repeat(3,1fr);gap:10px;margin:29px 0 30px}.metric{min-height:100px;border:0;border-radius:18px;background:var(--paper);padding:17px 18px;box-shadow:0 1px 3px rgba(0,0,0,.035);color:var(--ink);font:inherit;text-align:left;cursor:pointer;transition:transform .16s ease,box-shadow .16s ease}.metric:hover{transform:translateY(-2px);box-shadow:0 7px 18px rgba(0,0,0,.08)}.metric:focus-visible{outline:3px solid rgba(0,113,227,.35);outline-offset:2px}.metric.feature{background:#111113;color:white}.metric .label{font-size:12px;color:var(--muted)}.metric.feature .label{color:#b8b8bd}.metric .value{margin-top:9px;font-weight:700;font-size:28px;letter-spacing:-.04em}.metric .hint{margin-top:5px;color:var(--muted);font-size:11px}.metric.feature .hint{color:#b8b8bd}.metric .go{display:block;margin-top:7px;color:var(--blue);font-size:11px;font-weight:600}.metric.feature .go{color:#8ec5ff}
    .section-head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin:0 0 13px}.section-head h2{margin:0;font-size:21px;letter-spacing:-.035em}.section-head p{margin:5px 0 0;color:var(--muted);font-size:12px}.filters{display:flex;flex-wrap:wrap;gap:7px}.filter{border:1px solid var(--line);border-radius:999px;background:#fff;color:#515156;padding:7px 10px;font:inherit;font-size:12px;cursor:pointer}.filter:hover{border-color:#a2a2a8}.filter.active{background:#1d1d1f;border-color:#1d1d1f;color:#fff}
    .feed{overflow:hidden;border:1px solid var(--line);border-radius:20px;background:#fff}.item{display:grid;grid-template-columns:94px minmax(0,1fr) auto;gap:16px;align-items:center;padding:13px 16px;border-bottom:1px solid #e5e5e9}.item:last-child{border-bottom:0}.thumb{width:94px;height:68px;position:relative;overflow:hidden;border-radius:12px;background:#e7e7ec}.thumb img{width:100%;height:100%;object-fit:cover;display:block}.thumb .fallback{position:absolute;inset:0;display:grid;place-items:center;color:#5c5c63;font-size:12px;font-weight:700;background:linear-gradient(135deg,#e8f2ff,#dbeee4)}.item[data-kind="技術元件"] .thumb .fallback{background:linear-gradient(135deg,#e3efff,#d7e7f4);color:#15629e}.item[data-kind="售後維修"] .thumb .fallback{background:linear-gradient(135deg,#fff1e6,#ffdfc0);color:#a44800}.item[data-kind="安全召回"] .thumb .fallback{background:linear-gradient(135deg,#fff1ef,#ffd8d4);color:#b42318}.item[data-kind="法規更新"] .thumb .fallback{background:linear-gradient(135deg,#f0edff,#e3defd);color:#6451b8}.item-main{min-width:0}.item-meta{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:11px;line-height:1.3}.kind{padding:3px 6px;border-radius:6px;background:var(--blue-soft);color:#0066cc;font-weight:700}.item[data-kind="售後維修"] .kind{background:var(--orange-soft);color:var(--orange)}.item[data-kind="安全召回"] .kind{background:var(--red-soft);color:var(--red)}.item[data-kind="法規更新"] .kind{background:var(--violet-soft);color:var(--violet)}.item[data-kind="產業趨勢"] .kind{background:var(--green-soft);color:var(--green)}.title{display:block;margin:6px 0 4px;color:var(--ink);font-size:15px;font-weight:700;letter-spacing:-.018em;line-height:1.34;text-decoration:none}.title:hover{color:var(--blue)}.brief{margin:0;color:#4a4a4f;font-size:13px;line-height:1.48;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.source-link{align-self:center;white-space:nowrap;color:var(--blue);font-size:12px;font-weight:600;text-decoration:none}.source-link:hover{text-decoration:underline}.empty{padding:54px 25px;text-align:center;color:var(--muted);font-size:14px}
    .below{display:grid;grid-template-columns:1.1fr .9fr;gap:14px;margin-top:28px}.panel{border-radius:20px;background:#fff;padding:20px;border:1px solid var(--line)}.panel h2{margin:0;font-size:17px;letter-spacing:-.025em}.panel p{color:var(--muted);font-size:12px;line-height:1.55}.ppt-list{margin-top:13px}.ppt-row{display:flex;align-items:center;gap:9px;border-top:1px solid #e5e5e9;padding:10px 0}.ppt-row:first-child{border-top:0}.dot{width:8px;height:8px;border-radius:50%;background:#b0b0b6}.dot.urgent{background:#d92d20}.dot.high{background:#e6a700}.ppt-content{min-width:0;flex:1}.ppt-title{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink);font-size:13px;font-weight:600;text-decoration:none}.ppt-meta{margin-top:3px;color:var(--muted);font-size:11px}.tiny-link{color:var(--blue);font-size:11px;font-weight:600;text-decoration:none}.health{margin-top:13px}.health summary{cursor:pointer;color:#424245;font-size:13px;font-weight:600}.health-list{display:grid;gap:0;margin-top:8px}.health-row{display:flex;justify-content:space-between;gap:9px;border-top:1px solid #e5e5e9;padding:9px 0;color:#424245;font-size:12px}.health-row small{display:block;margin-top:2px;color:var(--muted)}.ok{color:var(--green);font-size:11px;font-weight:700;white-space:nowrap}.failed{color:var(--red);font-size:11px;font-weight:700;white-space:nowrap}.foot{margin:22px 0 0;color:#86868b;font-size:11px;line-height:1.5}
    @media(max-width:800px){.wrap{padding:32px 16px 52px}.top{align-items:flex-start;flex-direction:column}h1{font-size:32px}.overview{grid-template-columns:repeat(2,1fr)}.metric.feature{grid-column:1/-1}.item{grid-template-columns:72px minmax(0,1fr);gap:12px;padding:12px}.thumb{width:72px;height:59px}.source-link{display:none}.below{grid-template-columns:1fr}.filters{justify-content:flex-start}.section-head{align-items:flex-start;flex-direction:column}}@media(max-width:420px){.overview{grid-template-columns:1fr}.metric.feature{grid-column:auto}.item{grid-template-columns:56px minmax(0,1fr)}.thumb{width:56px;height:52px}.brief{-webkit-line-clamp:3}}
  </style>
</head>
<body>
  <main class="wrap">
    <header class="top">
      <div><p class="eyebrow">E-MOBILITY INTELLIGENCE</p><h1>今日情報</h1><p class="sub" id="subtitle"></p></div>
      <div class="stamp" id="stamp"></div>
    </header>
    <section class="overview" id="overview"></section>
    <section>
      <div class="section-head"><div><h2>精選情報</h2><p>新品、技術與維修優先；首頁只顯示最值得看的項目。</p></div><div class="filters" id="filters"></div></div>
      <div class="feed" id="feed"></div>
    </section>
    <section class="below">
      <div class="panel"><h2>PPT 候選</h2><p>可直接開原文取圖、數據或產品規格。</p><div class="ppt-list" id="ppt"></div></div>
      <div class="panel"><h2>來源健康</h2><p id="source-summary"></p><details class="health"><summary>查看來源狀態</summary><div class="health-list" id="sources"></div></details></div>
    </section>
    <p class="foot">資料由 GitHub Actions 每日更新。全文、圖片與技術細節請以原始來源為準。</p>
  </main>
  <script>
    const data = __DASHBOARD_DATA__;
    const escapeHtml = (value='') => String(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const safeUrl = (value='') => /^https?:\/\//i.test(String(value)) ? String(value) : '';
    const dateText = value => { const d = new Date(value); return Number.isNaN(d) ? (value || '') : d.toLocaleDateString('zh-TW',{month:'numeric',day:'numeric'}); };
    const updateText = value => { const d = new Date(value); return Number.isNaN(d) ? (data.date || '—') : d.toLocaleString('zh-TW',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false}); };
    const sourceOk = (data.sources || []).filter(source => source.status === 'ok').length;
    const allItems = Array.isArray(data.items) ? data.items : [];
    const priorities = {urgent:0,high:1,normal:2,low:3};
    const displayName = {品牌新品:'新品',技術元件:'技術',售後維修:'維修',法規更新:'法規',安全召回:'召回',產業趨勢:'趨勢'};
    const filters = ['精選','品牌新品','技術元件','售後維修','法規更新','安全召回'];
    const count = category => allItems.filter(item => item.category === category).length;
    document.getElementById('stamp').textContent = `${updateText(data.updatedAt)} · 自動更新`;
    document.getElementById('subtitle').textContent = data.mode === 'demo' ? '示例資料' : `已從 ${sourceOk}/${(data.sources || []).length} 個來源整理，完整歷史資料已保存。`;
    const overview = [['首頁精選',allItems.length,'只顯示當日高訊號資料','feature','精選'],['新品',count('品牌新品'),'新車、新平台與產品發表','','品牌新品'],['技術',count('技術元件'),'電池、驅動、韌體與零組件','','技術元件'],['維修',count('售後維修'),'服務公告、保固、維修與更新','','售後維修']];
    document.getElementById('overview').innerHTML = overview.map(([label,value,hint,style,filter]) => `<button type="button" class="metric ${style}" data-metric-filter="${filter}" aria-label="查看${label}相關資訊"><div class="label">${label}</div><div class="value">${value}</div><div class="hint">${hint}</div><span class="go">查看相關資訊 →</span></button>`).join('');
    let active = '精選';
    const filterRoot = document.getElementById('filters');
    function renderFilters(){ filterRoot.innerHTML = filters.map(name => `<button class="filter ${name===active?'active':''}" data-filter="${name}">${name}</button>`).join(''); }
    function fallbackBrief(item){ return item.summary || '請開啟原文查看產品、規格或服務細節。'; }
    function image(item){ const url=safeUrl(item.imageUrl); const label=displayName[item.category] || '情報'; return `<div class="thumb">${url?`<img src="${escapeHtml(url)}" alt="" loading="lazy">`:''}<span class="fallback">${label}</span></div>`; }
    function matchingItems(){ const matching = active === '精選' ? allItems.filter(item => item.featured !== false) : allItems.filter(item => item.category === active); return [...matching].sort((a,b)=>(priorities[a.importance] ?? 9)-(priorities[b.importance] ?? 9)); }
    function renderFeed(){ const rows=matchingItems(); const feed=document.getElementById('feed'); if(!rows.length){feed.innerHTML='<div class="empty">今天沒有符合這個分類的高訊號資料。</div>';return;} feed.innerHTML=rows.map(item=>{const url=safeUrl(item.articleUrl);const title=item.titleZh || item.title || '未命名資料';const brief=item.briefZh || fallbackBrief(item);return `<article class="item" data-kind="${escapeHtml(item.category || '')}">${image(item)}<div class="item-main"><div class="item-meta"><span class="kind">${escapeHtml(displayName[item.category] || item.category || '情報')}</span><span>${escapeHtml(item.sourceName || '')}</span><span>·</span><span>${escapeHtml(dateText(item.publishedAt))}</span></div>${url?`<a class="title" href="${escapeHtml(url)}" target="_blank" rel="noreferrer">${escapeHtml(title)}</a>`:`<div class="title">${escapeHtml(title)}</div>`}<p class="brief">${escapeHtml(brief)}</p></div>${url?`<a class="source-link" href="${escapeHtml(url)}" target="_blank" rel="noreferrer">原文 ↗</a>`:''}</article>`;}).join(''); feed.querySelectorAll('img').forEach(node=>node.addEventListener('error',()=>node.remove(),{once:true})); }
    function selectCategory(category, moveToFeed=false){active=category;renderFilters();renderFeed();if(moveToFeed)document.getElementById('feed').scrollIntoView({behavior:'smooth',block:'start'});}
    filterRoot.addEventListener('click',event=>{const button=event.target.closest('[data-filter]');if(!button)return;selectCategory(button.dataset.filter);});
    document.getElementById('overview').addEventListener('click',event=>{const button=event.target.closest('[data-metric-filter]');if(!button)return;selectCategory(button.dataset.metricFilter,true);});
    renderFilters();renderFeed();
    const pptItems=[...allItems].filter(item=>['urgent','high'].includes(item.importance)).slice(0,8);
    document.getElementById('ppt').innerHTML = pptItems.length ? pptItems.map(item=>{const url=safeUrl(item.articleUrl);const title=item.titleZh || item.title;return `<div class="ppt-row"><span class="dot ${escapeHtml(item.importance)}"></span><div class="ppt-content">${url?`<a class="ppt-title" href="${escapeHtml(url)}" target="_blank" rel="noreferrer">${escapeHtml(title)}</a>`:`<div class="ppt-title">${escapeHtml(title)}</div>`}<div class="ppt-meta">${escapeHtml(item.category || '')} · ${escapeHtml(item.sourceName || '')}</div></div>${url?`<a class="tiny-link" href="${escapeHtml(url)}" target="_blank" rel="noreferrer">原文</a>`:''}</div>`;}).join('') : '<p>今日沒有需要優先做成投影片的項目。</p>';
    document.getElementById('source-summary').textContent = `${sourceOk}/${(data.sources || []).length} 個來源成功連線。`;
    document.getElementById('sources').innerHTML=(data.sources || []).map(source=>`<div class="health-row"><span>${escapeHtml(source.name || source.id || '')}<small>${source.status==='ok'?`${source.candidates || 0} 則候選資料`:escapeHtml(source.error || '未連線')}</small></span><strong class="${source.status==='ok'?'ok':'failed'}">${source.status==='ok'?'正常':'需檢查'}</strong></div>`).join('');
  </script>
</body>
</html>
